# Brings up the full stack: PostgreSQL (with pgvector) + the FinTrack API.
#   docker compose up --build
# API:     http://localhost:8080/swagger
# Postgres: localhost:5432

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fintrack}
      POSTGRES_USER: ${POSTGRES_USER:-fintrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrack}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/src/FinTrack.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-fintrack};Username=${POSTGRES_USER:-fintrack};Password=${POSTGRES_PASSWORD:-fintrack}
      Jwt__Secret: ${JWT_SECRET:-local-dev-only-change-me-a-long-random-secret-1234567890}
      Jwt__Issuer: fintrack
      Jwt__Audience: fintrack-client
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"

volumes:
  db-data:
