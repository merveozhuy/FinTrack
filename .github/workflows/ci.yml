name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore backend/FinTrack.sln

      - name: Build
        run: dotnet build backend/FinTrack.sln -c Release --no-restore

      # Integration tests spin up PostgreSQL via Testcontainers; Docker is available on the runner.
      - name: Test
        run: dotnet test backend/FinTrack.sln -c Release --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/fintrack-client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/fintrack-client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
